[project]
name = "leaselens-pipeline"
version = "0.1.0"
description = "Ingestion pipeline for LeaseLens Toronto"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "requests>=2.31",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leaselens-pipeline = "leaselens_pipeline.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["db: needs a local PostgreSQL server (skipped when unavailable)"]
